<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADA SSO: Portal Layanan Terpadu Kementerian PANRB</title>
    <meta name="description" content="Single Sign-On Portal Kementerian Pendayagunaan Aparatur Negara dan Reformasi Birokrasi">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#01347C">

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Fonts: Plus Jakarta Sans (headings) + Inter (body) -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/src/style.css">
</head>

<body>
    <!-- Skip link for screen readers -->
    <a class="skip-link" href="#main-content">Langsung ke konten utama</a>

    <div class="auth-container">
        <!-- LEFT PANEL: sama dengan brandPanel() di src/shell.ts -->
        <aside class="brand-panel" aria-label="Identitas Kementerian PANRB">
            <div class="brand-logo-card">
                <img src="/logo-panrb.png" alt="Logo Kementerian PANRB" width="203" height="44">
            </div>
            <div class="brand-hero">
                <h2>Satu akun untuk semua layanan PANRB.</h2>
                <p>Portal SSO resmi Kementerian PANRB.</p>
            </div>
            <p class="brand-footer">© 2026 Kementerian PANRB, Republik Indonesia</p>
        </aside>

        <!-- RIGHT PANEL: Login form (SPA mount point) -->
        <main class="form-panel" role="main" id="main-content">
            <div id="app">
                <!-- SPA content rendered by router -->
                <div class="auth-card">
                    <div class="loading-state">
                        <div class="spinner spinner-dark spinner-lg"></div>
                        <p>Memuat…</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
