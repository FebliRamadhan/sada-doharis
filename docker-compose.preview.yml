# =============================================================================
# SADA SSO — PR Preview Stack
#
# Designed for a single preview VM running Traefik with a wildcard cert for
# *.${PREVIEW_DOMAIN}. Each PR is deployed as a separate compose project
# (COMPOSE_PROJECT_NAME=pr-<number>) so containers, networks, and volumes are
# isolated per PR. Resource footprint is intentionally smaller than prod.
#
# Required env (set by the deploy workflow):
#   PR_NUMBER             — pull request number, used in hostnames
#   PREVIEW_DOMAIN        — wildcard base, e.g. preview.sso.panrb.go.id
#   AUTH_SERVICE_IMAGE    — ghcr.io/<owner>/<repo>/auth-service
#   GATEWAY_IMAGE         — ghcr.io/<owner>/<repo>/gateway
#   AUTH_UI_IMAGE         — ghcr.io/<owner>/<repo>/auth-ui
#   VERSION               — image tag (sha-<commit>)
#   JWT_SECRET, SESSION_COOKIE_SECRET — random per-PR secrets
#
# Usage on the preview VM:
#   COMPOSE_PROJECT_NAME=pr-${PR_NUMBER} \
#     docker compose -f docker-compose.preview.yml --env-file .env.preview up -d
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sada_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  auth-service:
    image: ${AUTH_SERVICE_IMAGE}:${VERSION}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - AUTH_SERVICE_PORT=3001
      - LOG_LEVEL=debug
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sada_db?schema=public
      - REDIS_URL=redis://redis:6379
      - OIDC_ISSUER=https://pr-${PR_NUMBER}.${PREVIEW_DOMAIN}
      - CORS_ORIGIN=https://pr-${PR_NUMBER}.${PREVIEW_DOMAIN}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_EXPIRES_IN=15m
      - JWT_REFRESH_TOKEN_EXPIRES_IN=7d
      - SESSION_COOKIE_SECRET=${SESSION_COOKIE_SECRET}
      - SESSION_TTL=1d
      - INTERNAL_EMAIL_DOMAIN=${INTERNAL_EMAIL_DOMAIN:-menpan.go.id}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - AUDIT_LOG_ENABLED=true
      - RSA_PRIVATE_KEY_PATH=/app/keys/private.pem
      - RSA_PUBLIC_KEY_PATH=/app/keys/public.pem
      - RSA_KEY_ID=key-1
    volumes:
      - keys:/app/keys:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health/ready"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  nginx:
    image: ${AUTH_UI_IMAGE}:${VERSION}
    restart: unless-stopped
    volumes:
      - ./docker/nginx.single-domain.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
    networks:
      - internal
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.pr-${PR_NUMBER}.rule=Host(`pr-${PR_NUMBER}.${PREVIEW_DOMAIN}`)
      - traefik.http.routers.pr-${PR_NUMBER}.entrypoints=websecure
      - traefik.http.routers.pr-${PR_NUMBER}.tls=true
      - traefik.http.routers.pr-${PR_NUMBER}.tls.certresolver=le
      - traefik.http.services.pr-${PR_NUMBER}.loadbalancer.server.port=80

volumes:
  postgres_data:
  redis_data:
  keys:

networks:
  internal:
    driver: bridge
  traefik:
    external: true
