name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sada_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sada_auth_test?schema=public
      DATABASE_AUTH_URL: postgresql://postgres:postgres@localhost:5432/sada_auth_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sada_auth_test
      TEST_API_URL: http://localhost:3001
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-not-for-production-use-only-1234567890
      SESSION_COOKIE_SECRET: ci-test-cookie-secret-not-for-prod-1234567890
      OIDC_ISSUER: http://localhost:3001
      AUDIT_LOG_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm --filter @sada/auth-service exec prisma migrate deploy --schema=../../prisma/schema.prisma

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration
        continue-on-error: true

  docker-build:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        target:
          - { name: auth, dockerfile: docker/Dockerfile.auth }
          - { name: gateway, dockerfile: docker/Dockerfile.gateway }
          - { name: auth-ui, dockerfile: docker/Dockerfile.auth-ui }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.target.dockerfile }}
          push: false
          tags: sada/${{ matrix.target.name }}:ci
          cache-from: type=gha,scope=${{ matrix.target.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.name }}
