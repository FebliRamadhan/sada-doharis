name: Deploy

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: sha-<commit>)'
        required: false
        default: ''

# Opt JS-based actions (checkout) into Node.js 24 — Node 20 is deprecated
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    name: Deploy to production
    # Self-hosted runner required: PROD_HOST is a private LAN IP unreachable from cloud runners
    runs-on: self-hosted
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: production
      url: ${{ vars.PROD_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            # Manual override (workflow_dispatch)
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            # On workflow_run, github.sha is the default-branch HEAD and can lag behind
            # the commit that actually triggered the Release. Prefer the Release's head_sha.
            SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
            echo "tag=sha-${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          source: "docker-compose.prod.yml,docker-compose.single-domain.yml,docker/,prisma/"
          target: ${{ secrets.PROD_DEPLOY_PATH }}

      - name: Pull, migrate, restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.PROD_DEPLOY_PATH }}"

            # Image references resolve against GHCR; compose reads them via env.
            # GHCR repository names must be lowercase, so normalise the owner/repo.
            export VERSION="${{ steps.tag.outputs.tag }}"
            REPO_LC="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
            export GATEWAY_IMAGE="ghcr.io/${REPO_LC}/gateway"
            export AUTH_SERVICE_IMAGE="ghcr.io/${REPO_LC}/auth-service"
            export AUTH_UI_IMAGE="ghcr.io/${REPO_LC}/auth-ui"

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USER }}" --password-stdin

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml run --rm auth-service \
              pnpm --filter @sada/auth-service exec prisma migrate deploy \
              --schema=../../prisma/schema.prisma
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

      - name: Healthcheck
        run: |
          for i in {1..20}; do
            if curl -fsS "${{ vars.PROD_URL }}/health" >/dev/null; then
              echo "Service is healthy"
              exit 0
            fi
            echo "Waiting for service... ($i/20)"
            sleep 6
          done
          echo "Healthcheck failed"
          exit 1
