name: Deploy

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: sha-<commit>)'
        required: false
        default: ''

# Opt JS-based actions (checkout) into Node.js 24 — Node 20 is deprecated
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    name: Deploy to production
    # Self-hosted runner required: PROD_HOST is a private LAN IP unreachable from cloud runners
    runs-on: self-hosted
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: production
      url: ${{ vars.PROD_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            # Manual override (workflow_dispatch)
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            # On workflow_run, github.sha is the default-branch HEAD and can lag behind
            # the commit that actually triggered the Release. Prefer the Release's head_sha.
            SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
            echo "tag=sha-${SHA}" >> "$GITHUB_OUTPUT"
          fi

      # scp/ssh bawaan runner, bukan appleboy/*-action: action berbasis Docker itu
      # harus menarik image dari ghcr.io, dan runner self-hosted ditolak ("denied").
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          chmod 600 "$RUNNER_TEMP/ssh/key"

      - name: Copy compose files to server
        env:
          HOST: ${{ secrets.PROD_HOST }}
          USER: ${{ secrets.PROD_USER }}
          PORT: ${{ secrets.PROD_SSH_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          scp -i "$RUNNER_TEMP/ssh/key" -P "$PORT" -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            -r docker-compose.prod.yml docker-compose.single-domain.yml docker prisma \
            "$USER@$HOST:$DEPLOY_PATH/"

      - name: Pull, migrate, restart
        env:
          HOST: ${{ secrets.PROD_HOST }}
          USER: ${{ secrets.PROD_USER }}
          PORT: ${{ secrets.PROD_SSH_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
          VERSION: ${{ steps.tag.outputs.tag }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          REPO_LC="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          # Nilai dikirim lewat stdin (bukan argumen) supaya token tidak tampak di daftar proses.
          {
            printf 'export DEPLOY_PATH=%q VERSION=%q GHCR_USER=%q GHCR_TOKEN=%q\n' \
              "$DEPLOY_PATH" "$VERSION" "$GHCR_USER" "$GHCR_TOKEN"
            printf 'export GATEWAY_IMAGE=%q AUTH_SERVICE_IMAGE=%q AUTH_UI_IMAGE=%q\n' \
              "ghcr.io/$REPO_LC/gateway" "ghcr.io/$REPO_LC/auth-service" "ghcr.io/$REPO_LC/auth-ui"
            cat <<'SCRIPT'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml run --rm auth-service \
            pnpm --filter @sada/auth-service exec prisma migrate deploy \
            --schema=../../prisma/schema.prisma
          docker compose -f docker-compose.prod.yml up -d --remove-orphans --no-build
          docker image prune -f
          SCRIPT
          } | ssh -i "$RUNNER_TEMP/ssh/key" -p "$PORT" -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
                "$USER@$HOST" 'bash -s'

      - name: Remove SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"

      - name: Healthcheck
        run: |
          for i in {1..20}; do
            # /api ikut dicek: nginx auth-ui bisa 502 di /api walau /health hijau.
            if curl -fsS "${{ vars.PROD_URL }}/health" >/dev/null \
              && curl -fsS "${{ vars.PROD_URL }}/api/auth/config" >/dev/null; then
              echo "Service is healthy"
              exit 0
            fi
            echo "Waiting for service... ($i/20)"
            sleep 6
          done
          echo "Healthcheck failed"
          exit 1
